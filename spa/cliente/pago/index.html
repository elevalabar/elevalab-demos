<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Pasarela de pago simulada · Spa Demo · ElevaLab</title>
  <meta name="theme-color" content="#1f2933">
  <link rel="icon" type="image/svg+xml" href="../../img/spa-demo-marca.svg">
  <link rel="stylesheet" href="../../../assets/css/elevalab-tokens.css">
  <link rel="stylesheet" href="../../../assets/css/base.css">
  <link rel="stylesheet" href="../../../assets/css/demo-shell.css">
  <link rel="stylesheet" href="../../css/pasarela.css">
</head>
<body class="vista-pasarela">
  <div id="demo-shell"></div>

  <main class="pasarela-pagina">
    <div class="contenedor">
      <div id="pasarela"></div>
      <noscript><p>Para usar la demostración hace falta JavaScript.</p></noscript>
    </div>
  </main>

  <script src="../../js/core/config-demo.js"></script>
  <script src="../../js/core/tiempo.js"></script>
  <script src="../../js/core/estados.js"></script>
  <script src="../../js/core/disponibilidad.js"></script>
  <script src="../../js/core/reservas.js"></script>
  <script src="../../js/core/semillas.js"></script>
  <script src="../../js/core/almacen.js"></script>
  <script src="../../../assets/js/demo-shell.js"></script>
  <script src="../../js/cliente/pasarela.js"></script>
  <script>
    (function () {
      var ED = window.ElevaDemo;
      var almacen = ED.almacen.crear({ storage: ED.almacen.obtenerStorage(), ventana: window });
      ED.shell.montar({ destino: 'demo-shell', vista: 'cliente', rutas: { cliente: '../index.html', admin: '../../admin/index.html' }, almacen: almacen });
      ED.pasarela.montar({ almacen: almacen, destino: 'pasarela', volver: '../turno/index.html', inicio: '../index.html#reserva' });
    })();
  </script>
</body>
</html>
