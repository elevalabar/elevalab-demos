<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Página no encontrada · Demostraciones ElevaLab</title>
  <style>
    /* Autocontenida a propósito: una página 404 se sirve desde cualquier ruta, así que no puede depender de rutas relativas. */
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0d; color: #efede8;
           font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; line-height: 1.6; padding: 24px; }
    main { max-width: 520px; text-align: center; }
    h1 { font-size: 2rem; margin: 0 0 .4em; }
    p { color: #a6a7b0; margin: 0 0 1.4em; }
    a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border-radius: 999px;
        background: #f2c14e; color: #16161a; font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 2px solid #ffd980; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>No encontramos esa página</h1>
    <p>Puede que el enlace esté mal escrito o que la demostración todavía no exista.</p>
    <a id="volver" href="/">Volver a las demostraciones</a>
  </main>
  <script>
    // Mientras la demo se prueba en elevalabar.github.io/elevalab-demos/ la raíz del sitio no es «/».
    (function () {
      var base = /\.github\.io$/.test(location.hostname) ? '/elevalab-demos/' : '/';
      document.getElementById('volver').setAttribute('href', base);
    })();
  </script>
</body>
</html>
